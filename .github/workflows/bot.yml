name: bot-cripto

on:
  schedule:
    # ATENCAO: cron do GitHub e SEMPRE em UTC. Brasilia = UTC-3.
    - cron: "5 11 * * *"                 # 08:05 BRT -- resumo de mercado
    - cron: "15 12,15,18,21 * * *"       # 09:15, 12:15, 15:15, 18:15 BRT -- noticias
    - cron: "20 16 * * *"                # 13:20 BRT todo dia -- ranking do dia (imagem + chamada pro grupo)
    - cron: "30 6 * * 1"                 # segunda 03:30 BRT -- renova o token do Threads
  push:                                  # mudou este arquivo? roda a renovacao na hora (prova o GH_PAT sem clicar)
    paths: [".github/workflows/bot.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "O que fazer"
        type: choice
        options: [news, market, ranking, refresh]
        default: news
      dry_run:
        description: "Somente simular (nao publica)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bot-cripto
  cancel-in-progress: false

env:
  CRON_REFRESH: "30 6 * * 1"

jobs:
  publicar:
    if: github.event_name != 'push' && github.event.schedule != '30 6 * * 1' && inputs.mode != 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # Opcionais
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Chaves do X -- so usadas se voce mudar platform para "x" no config.yaml
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '5 11 * * *' && 'market' || github.event.schedule == '20 16 * * *' && 'ranking' || 'news') }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          ARGS="--mode $MODE"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$MODE" = "ranking" ]; then
            # a imagem precisa estar publica: o repositorio tem que ser PUBLICO para a URL raw funcionar
            ARGS="$ARGS --image-url https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/artes/ranking.png --caption-file artes/ranking.txt"
          fi
          echo "Executando: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: Salvar historico (state.json)
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/state.json)" ]; then
            echo "Nada mudou no estado."
            exit 0
          fi
          git config user.name  "bot-cripto"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: atualiza historico de posts [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  renovar-token:
    if: github.event_name == 'push' || github.event.schedule == '30 6 * * 1' || inputs.mode == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Renovar token do Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_threads_token.py
