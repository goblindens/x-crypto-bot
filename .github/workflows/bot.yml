name: bot-cripto

on:
  schedule:
    # ATENCAO: cron do GitHub e SEMPRE em UTC. Brasilia = UTC-3.
    # Grade de 14/09/2026 (imagem em todo post): 8 posts/dia no Threads
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "0 10 * * *"                 # 07:00 BRT -- dado: mercado agora (card)
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "0 12 * * *"                 # 09:00 BRT -- dado: Medo & Ganancia (grafico)
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "5 */6 * * *"                # a cada 6 h -- TEMPO REAL: job continuo que olha os feeds a cada 90 s e publica na hora (14/09)
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "20 16 * * *"                # 13:20 BRT todo dia -- ranking do dia (imagem + chamada pro grupo)
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "0 21 * * *"                 # 18:00 BRT -- dado: mais buscadas (card)
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "0 22 * * *"                 # 19:00 BRT -- TERMOMETRO DA TROPA (melhor faixa de alcance dele)
    #PAUSADO 17/09 (ele: 'pause o threads, so ele') - cron: "0 23 * * *"                 # 20:00 BRT -- dado: stablecoins (dia par) / hashrate (dia impar)
    - cron: "30 6 * * 1"                 # segunda 03:30 BRT -- renova o token do Threads
  workflow_dispatch:
    inputs:
      mode:
        description: "O que fazer"
        type: choice
        options: [news, market, ranking, dado, loop, refresh]
        default: news
      tipo:
        description: "modo dado: termometro | mercado | fng | trending | stable | hashrate | btc"
        type: string
        default: mercado
      dry_run:
        description: "Somente simular (nao publica)"
        type: boolean
        default: true
      force:
        description: "Ignorar as travas (1 ranking/dado por dia, espacamento). So quando voce quer republicar de proposito."
        type: boolean
        default: false

permissions:
  contents: write

env:
  CRON_REFRESH: "30 6 * * 1"

jobs:
  publicar:
    if: github.event.schedule != '30 6 * * 1' && github.event.schedule != '5 */6 * * *' && inputs.mode != 'refresh' && inputs.mode != 'loop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bot-cripto-publicar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # Opcionais
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Chaves do X -- so usadas se voce mudar platform para "x" no config.yaml
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '20 16 * * *' && 'ranking' || (github.event.schedule == '0 10 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '0 21 * * *' || github.event.schedule == '0 22 * * *' || github.event.schedule == '0 23 * * *') && 'dado' || 'news') }}
          TIPO: ${{ github.event_name == 'workflow_dispatch' && inputs.tipo || (github.event.schedule == '0 10 * * *' && 'mercado' || github.event.schedule == '0 12 * * *' && 'fng' || github.event.schedule == '0 21 * * *' && 'trending' || github.event.schedule == '0 22 * * *' && 'termometro' || github.event.schedule == '0 23 * * *' && 'alternado' || 'mercado') }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          ARGS="--mode $MODE"
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$MODE" = "dado" ]; then
            if [ "$TIPO" = "alternado" ]; then
              # dia par = stablecoins, dia impar = hashrate
              if [ $(( $(date -u +%d) % 2 )) -eq 0 ]; then TIPO=stable; else TIPO=hashrate; fi
            fi
            ARGS="$ARGS --tipo $TIPO"
          fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$MODE" = "ranking" ]; then
            # a imagem precisa estar publica: o repositorio tem que ser PUBLICO para a URL raw funcionar
            ARGS="$ARGS --image-url https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/artes/ranking.png --caption-file artes/ranking.txt"
          fi
          echo "Executando: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: Salvar historico (state.json)
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/state.json)" ]; then
            echo "Nada mudou no estado."
            exit 0
          fi
          git config user.name  "bot-cripto"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: atualiza historico de posts [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  tempo-real:
    # Processo continuo (ate ~6 h por job; o cron re-dispara a cada 6 h). Olha os feeds a cada
    # 90 s e publica na hora, 1 post por rodada, com card e verificador. Nunca dois ao mesmo tempo.
    if: github.event.schedule == '5 */6 * * *' || inputs.mode == 'loop'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    concurrency:
      group: bot-cripto-tempo-real
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar em tempo real
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          git config user.name  "bot-cripto"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MIN=350; ARGS="--mode loop --a-cada 30"
          if [ "$DRY" = "true" ]; then MIN=3; ARGS="$ARGS --dry-run"; fi
          echo "Executando: python -m src.main $ARGS --minutos $MIN"
          python -m src.main $ARGS --minutos $MIN
      - name: Salvar historico (state.json)
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/state.json)" ]; then echo "Nada mudou no estado."; exit 0; fi
          git config user.name  "bot-cripto"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: atualiza historico de posts [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  renovar-token:
    if: github.event.schedule == '30 6 * * 1' || inputs.mode == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Renovar token do Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_threads_token.py
      - name: Avisar o Healthchecks (silencio = alerta no celular)
        if: always()
        run: |
          if [ -n "${{ vars.HC_GITHUB }}" ]; then
            SUFIXO=""; [ "${{ job.status }}" = "success" ] || SUFIXO="/fail"
            curl -fsS -m 10 --retry 3 "${{ vars.HC_GITHUB }}$SUFIXO" >/dev/null || true
          fi
