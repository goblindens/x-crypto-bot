# ---------------------------------------------------------------------------
# Configuracao do bot. Edite aqui, nao no codigo.
# ---------------------------------------------------------------------------

# Onde publicar: "threads" (API gratuita da Meta) ou "x" (pago por post desde
# fevereiro/2026 -- $0,015 por post, $0,20 se tiver link).
platform: threads

timezone: America/Sao_Paulo

limits:
  max_posts_per_month: 400      # trava de seguranca (o Threads permite 250/DIA)
  max_posts_per_run: 2          # quantos posts por execucao (modo news)
  max_posts_per_day: 8          # teto diario (API free do X = 17 posts/24h)
  min_minutes_between_posts: 40 # espacamento minimo entre dois posts
  max_per_source_per_run: 1     # evita 2 manchetes da mesma fonte seguidas

# ---------------------------------------------------------------------------
# Espelho Instagram -> X (modo "espelho"). Roda na VPS de carona na tarefa do
# ig2yt. Regras medidas em 12/09/2026 -- ver o cofre, x-o-que-funciona-no-nicho.
# ---------------------------------------------------------------------------
espelho:
  lookback: 10                  # quantos posts recentes do Instagram olhar por vez
  max_per_run: 1                # no maximo 1 espelhado por execucao (a tarefa roda a cada 2 min)
  reels: true                   # Reels/videos tambem (4 dos 6 ultimos posts dele sao Reels)
  max_caption_chars: 120        # so a primeira linha da legenda, cortada aqui
  caps_words_to_skip: 3         # 3+ palavras em CAIXA ALTA = anuncio; nao espelha
  skip_terms: ["🚨"]            # sirene = post de parceria; nao espelha
  # TEMPO REAL (decisao dele, 12/09/2026): postou no Instagram, postou no X.
  # 0 = sem espacamento; windows vazio = qualquer hora. Fica so o teto diario
  # (limits.max_posts_per_day) como seguranca. Os horarios que rendem mais na
  # conta dele (07h, 12-14h, 19-21h) continuam anotados no cofre, se um dia
  # quiser voltar a segurar: windows: ["07:00-07:59","12:00-14:59","19:00-21:59"]
  min_minutes_between_posts: 0
  windows: []

news:
  max_age_hours: 10             # ignora noticia mais velha que isso
  min_score: 8                  # nota minima de relevancia para publicar (era 4; "apenas relevantes", 13/09/2026)
  exigir_assunto: true          # sem palavra de parceiro/alta/media, nao publica
  feeds:
    - name: Portal do Bitcoin
      url: https://portaldobitcoin.uol.com.br/feed/
      weight: 4
      lang: pt
    - name: Livecoins
      url: https://livecoins.com.br/feed/
      weight: 3
      lang: pt
    - name: CriptoFacil
      url: https://www.criptofacil.com/feed/
      weight: 3
      lang: pt
    - name: BeInCrypto Brasil
      url: https://br.beincrypto.com/feed/
      weight: 3
      lang: pt
    - name: Money Times Cripto
      url: https://www.moneytimes.com.br/tag/criptomoedas/feed/
      weight: 3
      lang: pt
    - name: InfoMoney
      url: https://www.infomoney.com.br/feed/
      weight: 2
      lang: pt
    - name: Exame Invest
      url: https://exame.com/invest/feed/
      weight: 2
      lang: pt
    # ---------------------------------------------------------------------
    # PARCEIROS (13/09/2026): canal oficial, vai na frente, sai com chamada
    # pra comunidade e link na 1a resposta. Kraken tem RSS; OKX e lida da
    # pagina de anuncios (okx_anuncios abaixo); Ledger bloqueia robo (401).
    # ---------------------------------------------------------------------
    - name: Kraken Blog
      url: https://blog.kraken.com/feed
      weight: 5
      lang: en
      parceiro: true
    # ---------------------------------------------------------------------
    # Fontes em ingles: DESLIGADAS por padrao. No modo template o bot nao
    # traduz -- a manchete sairia em ingles. Ligue (enabled: true) se voce
    # quiser postar em ingles ou se ativar o composer com a Claude.
    # ---------------------------------------------------------------------
    - name: CoinDesk
      url: https://www.coindesk.com/arc/outboundfeeds/rss/
      weight: 4
      lang: en
      enabled: false
    - name: Cointelegraph
      url: https://cointelegraph.com/rss
      weight: 3
      lang: en
      enabled: false
    - name: Decrypt
      url: https://decrypt.co/feed
      weight: 3
      lang: en
      enabled: false
    - name: The Block
      url: https://www.theblock.co/rss.xml
      weight: 4
      lang: en
      enabled: false
    - name: Bitcoin Magazine
      url: https://bitcoinmagazine.com/feed
      weight: 2
      lang: en
      enabled: false

  # Palavras que aumentam a nota (peso entre parenteses)
  keywords:
    parceiros: # +6 -- parcerias dele (13/09/2026): quando sai algo sobre eles, vai na frente
      - okx
      - ledger
      - kraken
    alta:      # +3
      - bitcoin
      - ethereum
      - etf
      - sec
      - federal reserve
      - fed
      - cpi
      - halving
      - regulamenta
      - regulation
      - regras         # 14/09: "CLARITY Act amplia regras" tinha ficado de fora
      - lei
      - clarity act
      - corretora
      - exchange
      - etf
      - banco central
      - selic
      - juros
      - hackeado
      - hacker
      - invasao
      - liquida
    media:     # +2
      - solana
      - xrp
      - stablecoin
      - usdt
      - usdc
      - binance
      - coinbase
      - blackrock
      - tesouro
      - ibovespa
      - dolar
      - drex
      - tokeniza
    baixa:     # +1
      - defi
      - nft
      - staking
      - layer 2
      - mineracao
      - mining
      - altcoin
      - carteira
      - wallet

  # Se a manchete contiver qualquer um destes termos, e descartada
  blocklist:
    - presale
    - pre-venda
    - patrocinado
    - sponsored
    - press release
    - promoted
    - airdrop gratis
    - como comprar
    - price prediction
    - previsao de preco
    # previsao de preco disfarcada (regra dele: nunca prever preco) -- 13/09/2026
    - pode saltar
    - pode subir
    - pode disparar
    - pode cair
    - pode chegar a
    - vai a us$
    - vai a r$
    - ate 2027
    - ate 2028
    - ate 2030
    - projecao
    - preco-alvo
    - alvo de preco
    - proximo alvo
    - analista preve
    - analistas preveem
    - guia de
    - ouro de tolo
    - melhores corretoras
    - cassino
    - apostas

market:
  # ids do CoinGecko
  coins:
    - id: bitcoin
      symbol: BTC
    - id: ethereum
      symbol: ETH
    - id: solana
      symbol: SOL
    - id: ripple
      symbol: XRP
  vs_currency: usd
  include_fear_greed: true
  include_dominance: true

style:
  language: pt-BR
  # Como o bot deve escrever. Isso vai direto no prompt da Claude.
  voice: >-
    Direto, informativo e sobrio. Zero hype, zero emoji em excesso, zero
    recomendacao de compra ou venda. Escreve como um jornalista de mercado
    brasileiro: primeiro o fato, depois o numero ou o contexto que importa.
  hashtags_max: 2
  hashtag_default: "#Cripto"     # sempre entra quando sobra espaco
  # tag -> termos que a acionam (procurados no texto do post)
  hashtag_pool:
    "#Bitcoin":  [bitcoin, btc]
    "#Ethereum": [ethereum, ether, eth]
    "#Solana":   [solana, sol]
    "#XRP":      [xrp, ripple]
    "#ETF":      [etf]
    "#Economia": [selic, juros, inflacao, banco central, dolar, ibovespa, fed]
  disclaimer_every_n_posts: 0   # 0 = desligado

# ---------------------------------------------------------------------------
# Redacao dos posts
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Anuncios oficiais da OKX (pagina PT-BR, sem RSS). Manutencao, delist e
# migracao nao interessam a ninguem -- ficam de fora pelos termos abaixo.
# ---------------------------------------------------------------------------
okx_anuncios:
  enabled: true
  url: https://www.okx.com/pt-br/help/section/announcements-latest-announcements
  weight: 5
  pular_termos: ["manutenção", "manutencao", "suspender", "suspensão", "remover", "remoção",
                 "migrar", "migração", "delist", "taxa de interface", "descontinuar", "ajuste de", "atualização sobre"]

# ---------------------------------------------------------------------------
# Fluxo PARCEIRO (13/09/2026): noticia de OKX/Kraken/Ledger sai com chamada
# pra comunidade e o link do grupo na 1a resposta. Comeca em modo "mostrar"
# (ligado: false): o bot escreve o texto no log e NAO publica, por 2 dias,
# pra ele ver como fica. Depois: ligado: true.
# ---------------------------------------------------------------------------
parceiros:
  ligado: false
  nomes: ["OKX", "Kraken", "Ledger"]
  chamada: "Quer saber mais? A galera já tá comentando na comunidade 👇"
  resposta: "Entra aqui, é de graça: https://chat.whatsapp.com/ErFeZyBjel23uiNJirNDTp"
  max_por_semana_x: 3           # no X cada um custa US$ 0,20 (tem link)

composer:
  # false = template puro em Python. Custo ZERO, nenhuma chave de API.
  # true  = a Claude reescreve a manchete como post (exige ANTHROPIC_API_KEY,
  #         que e paga). Se a chave faltar ou a chamada falhar, o bot volta
  #         sozinho para o template -- nunca deixa de postar por isso.
  use_claude: true              # ligado em 13/09/2026 (ele autorizou a chave no GitHub): traduz e resume; se falhar, template

anthropic:          # so usado quando composer.use_claude = true
  model: claude-sonnet-5        # bom e barato; centavos por post
  effort: low
