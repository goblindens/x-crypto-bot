      url: https://news.google.com/rss/search?q=site:portaldobitcoin.uol.com.br+when:6h&hl=pt-BR&gl=BR&ceid=BR:pt-419
      weight: 5
      lang: pt
      googlenews: true
    - name: Livecoins
      url: https://livecoins.com.br/feed/
      weight: 4
      lang: pt
