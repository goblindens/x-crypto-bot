# ---------------------------------------------------------------------------
# Configuracao do bot. Edite aqui, nao no codigo.
# ---------------------------------------------------------------------------

# Onde publicar: "threads" (API gratuita da Meta) ou "x" (pago por post desde
# fevereiro/2026 -- $0,015 por post, $0,20 se tiver link).
platform: threads

timezone: America/Sao_Paulo

limits:
  max_posts_per_month: 400      # trava de seguranca (o Threads permite 250/DIA)
  max_posts_per_run: 1          # 1 por execucao: o bot roda a cada 30 min (14/09), sem rajada
  max_posts_per_day: 12         # teto diario (dele, 14/09: "vamos ate o limite" -> 12, mede 1 semana)
  min_minutes_between_posts: 30 # espacamento minimo entre dois posts
  max_per_source_per_run: 1     # evita 2 manchetes da mesma fonte seguidas

# ---------------------------------------------------------------------------
# Espelho Instagram -> X (modo "espelho"). Roda na VPS de carona na tarefa do
# ig2yt. Regras medidas em 12/09/2026 -- ver o cofre, x-o-que-funciona-no-nicho.
# ---------------------------------------------------------------------------
espelho:
  lookback: 10                  # quantos posts recentes do Instagram olhar por vez
  max_per_run: 1                # no maximo 1 espelhado por execucao (a tarefa roda a cada 2 min)
  reels: true                   # Reels/videos tambem (4 dos 6 ultimos posts dele sao Reels)
  max_caption_chars: 120        # so a primeira linha da legenda, cortada aqui
  caps_words_to_skip: 3         # 3+ palavras em CAIXA ALTA = anuncio; nao espelha
  skip_terms: ["🚨"]            # sirene = post de parceria; nao espelha
  # TEMPO REAL (decisao dele, 12/09/2026): postou no Instagram, postou no X.
  # 0 = sem espacamento; windows vazio = qualquer hora. Fica so o teto diario
  # (limits.max_posts_per_day) como seguranca. Os horarios que rendem mais na
  # conta dele (07h, 12-14h, 19-21h) continuam anotados no cofre, se um dia
  # quiser voltar a segurar: windows: ["07:00-07:59","12:00-14:59","19:00-21:59"]
  min_minutes_between_posts: 0
  windows: []

news:
  max_age_hours: 2              # so noticia fresca (dele, 14/09: "coisa antiga eu nao quero")
  min_score: 8                  # nota minima de relevancia para publicar (era 4; "apenas relevantes", 13/09/2026)
  exigir_assunto: true          # sem palavra de parceiro/alta/media, nao publica
  feeds:
    - name: Portal do Bitcoin
      url: https://portaldobitcoin.uol.com.br/feed/
      weight: 4
      lang: pt
    - name: Livecoins
      url: https://livecoins.com.br/feed/
      weight: 3
      lang: pt
    - name: CriptoFacil
      url: https://www.criptofacil.com/feed/
      weight: 3
      lang: pt
    - name: BeInCrypto Brasil
      url: https://br.beincrypto.com/feed/
      weight: 3
      lang: pt
    - name: Money Times Cripto
      url: https://www.moneytimes.com.br/tag/criptomoedas/feed/
      weight: 3
      lang: pt
    - name: InfoMoney
      url: https://www.infomoney.com.br/feed/
      weight: 2
      lang: pt
    - name: Exame Invest
      url: https://exame.com/invest/feed/
      weight: 2
      lang: pt
    # ---------------------------------------------------------------------
    # PARCEIROS (13/09/2026): canal oficial, vai na frente, sai com chamada
    # pra comunidade e link na 1a resposta. Kraken tem RSS; OKX e lida da
    # pagina de anuncios (okx_anuncios abaixo); Ledger bloqueia robo (401).
    # ---------------------------------------------------------------------
    - name: Kraken Blog
      url: https://blog.kraken.com/feed
      weight: 5
      lang: en
      parceiro: true
    # Portal do Bitcoin e Money Times bloqueiam o IP de Toquio (403): caminho alternativo via Google News
    - name: Portal do Bitcoin
      url: https://news.google.com/rss/search?q=site:portaldobitcoin.uol.com.br+when:12h&hl=pt-BR&gl=BR&ceid=BR:pt-419
      weight: 4
      lang: pt
      googlenews: true
    - name: Money Times Cripto
      url: https://news.google.com/rss/search?q=site:moneytimes.com.br+cripto+when:12h&hl=pt-BR&gl=BR&ceid=BR:pt-419
      weight: 3
      lang: pt
      googlenews: true
    - name: Kraken                    # o blog passou a bloquear robo (403, 14/09): via Google News tambem
      url: https://news.google.com/rss/search?q=site:blog.kraken.com+when:24h&hl=en-US&gl=US&ceid=US:en
      weight: 5
      lang: en
      parceiro: true
      googlenews: true
    # ---------------------------------------------------------------------
    # Fontes em ingles: DESLIGADAS por padrao. No modo template o bot nao
    # traduz -- a manchete sairia em ingles. Ligue (enabled: true) se voce
    # quiser postar em ingles ou se ativar o composer com a Claude.
    # ---------------------------------------------------------------------
    # LIGADAS em 14/09/2026 (IA traduz; sem IA a manchete em ingles nao sai)
    - name: CoinDesk
      url: https://www.coindesk.com/arc/outboundfeeds/rss/
      weight: 4
      lang: en
      enabled: true
    - name: Cointelegraph
      url: https://cointelegraph.com/rss
      weight: 3
      lang: en
      enabled: true
    - name: Decrypt
      url: https://decrypt.co/feed
      weight: 3
      lang: en
      enabled: true
    - name: The Block
      url: https://www.theblock.co/rss.xml
      weight: 4
      lang: en
      enabled: true
    - name: Bitcoin Magazine
      url: https://bitcoinmagazine.com/feed
      weight: 2
      lang: en
      enabled: false
    # ---------------------------------------------------------------------
    # GEOPOLITICA / MACRO (14/09/2026): so entra manchete que pode mexer no
    # mercado cripto (termos em `macro_termos`); o resto e descartado. Fontes
    # de imprensa estabelecida, nada de midia estatal (Fars, Al Mayadeen, RT).
    # ---------------------------------------------------------------------
    - name: WSJ World
      url: https://feeds.content.dowjones.io/public/rss/RSSWorldNews
      weight: 3
      lang: en
      grupo: macro
    - name: NYT World
      url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
      weight: 3
      lang: en
      grupo: macro
    - name: BBC World
      url: http://feeds.bbci.co.uk/news/world/rss.xml
      weight: 3
      lang: en
      grupo: macro
    - name: CNBC World
      url: https://www.cnbc.com/id/100727362/device/rss/rss.html
      weight: 3
      lang: en
      grupo: macro
    - name: Al Jazeera
      url: https://www.aljazeera.com/xml/rss/all.xml
      weight: 2
      lang: en
      grupo: macro
    - name: BBC Brasil
      url: https://feeds.bbci.co.uk/portuguese/rss.xml
      weight: 2
      lang: pt
      grupo: macro

    # ---------------------------------------------------------------------
    # AS PRINCIPAIS DO MUNDO (14/09/2026), via Google News RSS (elas nao abrem
    # RSS proprio): manchete chega em minutos, fonte vem no titulo. Mesmo
    # filtro macro: so o que mexe com cripto.
    # ---------------------------------------------------------------------
    - name: Reuters
      url: https://news.google.com/rss/search?q=site:reuters.com+when:12h&hl=en-US&gl=US&ceid=US:en
      weight: 5
      lang: en
      grupo: macro
      googlenews: true
    - name: Bloomberg
      url: https://news.google.com/rss/search?q=site:bloomberg.com+when:12h&hl=en-US&gl=US&ceid=US:en
      weight: 5
      lang: en
      grupo: macro
      googlenews: true
    - name: AP News
      url: https://news.google.com/rss/search?q=site:apnews.com+when:12h&hl=en-US&gl=US&ceid=US:en
      weight: 4
      lang: en
      grupo: macro
      googlenews: true
    - name: Financial Times
      url: https://news.google.com/rss/search?q=site:ft.com+when:12h&hl=en-US&gl=US&ceid=US:en
      weight: 4
      lang: en
      grupo: macro
      googlenews: true

  # Manchete de fonte `grupo: macro` so passa se tiver um destes termos
